name: Bug report
description: Report a reproducible problem in this downstream fork
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove usernames, passwords, VPN credentials, tokens, API keys, and other secrets from configuration and logs before posting."
  - type: input
    id: version
    attributes:
      label: Image or commit tested
      description: Identify the locally built image, commit, or upstream image used.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration used
      description: Include the relevant Docker command or Compose configuration with secrets removed.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: OS / host environment
      description: Include the host operating system and relevant host platform details.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Docker / container runtime and version
      description: Name the container runtime and its version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      description: Include logs that help reproduce the issue. Do not include usernames, passwords, VPN credentials, tokens, API keys, or other secrets.
    validations:
      required: true
